name: Page check

on:
  push:
    branches: [main]
    paths: ["docs/*.html", "docs/*.css", "docs/*.js", "docs/*.mjs", ".github/workflows/page-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/*.test.mjs"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: npx --yes http-server@14.1.1 docs -p 8080 -s &
      - run: node scripts/page-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
